<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F0E"/>
      <stop offset="100%" stop-color="#131A18"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4EE1A0"/>
      <stop offset="100%" stop-color="#2BB6C9"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- hex seal -->
  <polygon points="256,72 400,152 400,312 256,392 112,312 112,152"
           fill="none" stroke="url(#ring)" stroke-width="14" stroke-linejoin="round"/>

  <!-- fingerprint-style concentric arcs (hash "seal") -->
  <g fill="none" stroke="#4EE1A0" stroke-width="8" stroke-linecap="round">
    <path d="M180 232 a76 76 0 1 1 152 0" opacity="0.95"/>
    <path d="M198 240 a58 58 0 1 1 116 6" opacity="0.75"/>
    <path d="M216 250 a40 40 0 1 1 80 10" opacity="0.55"/>
  </g>

  <!-- checkmark -->
  <path d="M206 262 L242 300 L316 218" fill="none" stroke="#EAF7F1" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- circuit ticks around the ring -->
  <g stroke="#2BB6C9" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="72" x2="256" y2="44"/>
    <line x1="400" y1="152" x2="426" y2="136"/>
    <line x1="400" y1="312" x2="426" y2="328"/>
    <line x1="256" y1="392" x2="256" y2="420"/>
    <line x1="112" y1="312" x2="86" y2="328"/>
    <line x1="112" y1="152" x2="86" y2="136"/>
  </g>
</svg>
